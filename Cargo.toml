[package]
name = "pot-head"
version = "0.2.0"
edition = "2024"
authors = ["Esben Dueholm Nørgaard"]
license = "MIT OR Apache-2.0"
description = "A no_std Rust library for processing potentiometer inputs with filters, curves, and response modes"
repository = "https://github.com/HybridChild/pot-head"
documentation = "https://docs.rs/pot-head"
readme = "README.md"
keywords = ["embedded", "potmeter", "pot", "potentiometer", "no-std"]
categories = ["embedded", "no-std"]
exclude = ["examples/", "tools"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
libm = { version = "0.2", optional = true }
heapless = { version = "0.9.2", optional = true }

[features]
default = ["std-math", "grab-mode"]
# Enables logarithmic response curves via libm
std-math = ["libm"]
# Enables moving average filter (requires heapless buffer)
moving-average = ["heapless"]
# Enables grab modes (Pickup/PassThrough) for preset/automation handling
grab-mode = []
