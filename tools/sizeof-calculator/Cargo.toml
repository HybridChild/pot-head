[package]
name = "sizeof-calculator"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "sizeof-calculator"
path = "src/main.rs"

[[bin]]
name = "sizeof-embedded"
path = "src/bin/sizeof-embedded.rs"

[dependencies]
pot-head = { path = "../..", features = ["std-math", "grab-mode", "moving-average"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
chrono = "0.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
